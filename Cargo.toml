[package]
name = "ratl"
version = "0.1.0"
edition = "2024"
description = "Declarative terminal dialogs powered by ratatui"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
